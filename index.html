let session=null,screen='home';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){toast('保存できません。Safariの設定を確認してください。')}};const correctIds=()=>ALL.filter(x=>data.attempts[x.id]?.correct).map(x=>x.id);const title=()=>{let n=correctIds().length;return n===60?'三権分立グランドマスター':n>=45?'三権分立マスター':n>=25?'政治の達人':n>=10?'政治の研究員':'政治の見習い'};function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2500)}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function updateBadges(){let n=correctIds().length,review=data.reviewCorrect||0;const cond={first:n>=1,ten:n>=10,thirty:n>=30,sixty:n===60,streak5:data.bestStreak>=5,streak10:data.bestStreak>=10,easy:BANK.easy.every((_,i)=>data.attempts['easy-'+i]?.correct),medium:BANK.medium.every((_,i)=>data.attempts['medium-'+i]?.correct),hard:BANK.hard.every((_,i)=>data.attempts['hard-'+i]?.correct),review:review>=5};for(const b of BADGES)if(cond[b[0]]&&!data.earned.includes(b[0])){data.earned.push(b[0]);toast('🏆 バッジ獲得！ '+b[2])}save()}
function home(){screen='home';let n=correctIds().length;app.innerHTML=`<section class="panel"><h2>ようこそ！ 🎉</h2><p>現在の称号：<strong>${title()}</strong></p><div class="grid"><div><span class="pill">正解した問題 ${n}/60</span></div><div><span class="pill">合計ポイント ${data.points||0} pt</span></div><div><span class="pill">最高連続正解 ${data.bestStreak||0}</span></div></div><p class="muted small">一度でも正解した問題は「正解済み」として記録されます。各コースは20問です。</p><div class="progress"><div class="bar" style="width:${n/60*100}%"></div></div></section><section class="panel"><h2>コースを選ぼう</h2><div class="grid">${KEYS.map((k,i)=>`<button class="btn mode" data-mode="${k}">${['🌱','🚀','👑'][i]} ${NAMES[k]}<br><span class="small">${BANK[k].filter((_,j)=>data.attempts[k+'-'+j]?.correct).length}/20問 正解済み</span></button>`).join('')}</div><p><button class="btn green" data-mode="review" ${data.wrong.length?'':'disabled'}>🔁 間違えた問題を復習（${data.wrong.length}問）</button></p><p><button class="btn secondary" data-action="badges">🏆 バッジ一覧</button> <button class="btn secondary" data-action="help">📖 遊び方</button></p></section>`;app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));app.querySelector('[data-action=badges]').onclick=badges;app.querySelector('[data-action=help]').onclick=help}
function help(){screen='help';app.innerHTML=`<section class="panel"><h2>📖 遊び方</h2><p>初級・中級・上級にはそれぞれ20問あります。各回で20問に挑戦し、正解すると10ポイント、連続正解なら追加ポイントがもらえます（最大+10ポイント）。</p><p>間違えた問題は復習リストに入り、復習で正解するとリストから消えます。バッジは条件を満たすと獲得できます。途中でやめても、回答済みの学習記録は残ります。</p><p><strong>注意：</strong>保存先はこの端末・このブラウザです。プライベートブラウズ、履歴・サイトデータの削除、別の端末への変更で記録が失われる場合があります。先生が児童の成績を自動収集する機能はありません。</p><button class="btn secondary" data-back>← ホームへ</button></section>`;app.querySelector('[data-back]').onclick=home}
function badges(){screen='badges';app.innerHTML=`<section class="panel"><h2>🏆 バッジコレクション</h2><p>獲得済み ${data.earned.length}/${BADGES.length}個　称号：<strong>${title()}</strong></p><div class="grid">${BADGES.map(b=>`<div class="badge ${data.earned.includes(b[0])?'earned':''}"><div style="font-size:30px">${data.earned.includes(b[0])?b[1]:'🔒'}</div><strong>${b[2]}</strong><span class="small">${b[3]}</span></div>`).join('')}</div><p><button class="btn secondary" data-back>← ホームへ</button></p></section>`;app.querySelector('[data-back]').onclick=home}
function start(mode){let ids=mode==='review'?data.wrong.filter(id=>byId[id]):ALL.filter(q=>q.level===mode).map(q=>q.id);if(!ids.length){toast('復習する問題がありません');return}session={mode,ids:shuffle(ids),index:0,streak:0,score:0,answered:false,correct:0};question()}
function question(){screen='quiz';let s=session,id=s.ids[s.index],item=byId[id],q=item.q;s.answered=false;let options=shuffle(q.slice(1,5));s.options=options;app.innerHTML=`<section class="panel"><div class="grid"><span class="pill">${s.mode==='review'?'🔁 復習':NAMES[s.mode]}</span><span class="pill">${s.index+1}/${s.ids.length}問</span><span class="pill">⭐ ${s.score} pt</span><span class="pill">🔥 ${s.streak}連続</span></div><div class="progress" style="margin:16px 0"><div class="bar" style="width:${s.index/s.ids.length*100}%"></div></div><h2>${esc(q[0])}</h2><div id="choices">${options.map((o,i)=>`<button class="choice" data-choice="${i}">${['A','B','C','D'][i]}. ${esc(o)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><p><button class="btn secondary" id="quit">← ホームに戻る</button></p></section>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)));app.querySelector('#quit').onclick=()=>{session=null;home()}}
function answer(i){let s=session;if(s.answered)return;s.answered=true;let id=s.ids[s.index],q=byId[id].q,ok=s.options[i]===q[1];data.attempts[id]??={tries:0,correct:false};data.attempts[id].tries++;if(ok){data.attempts[id].correct=true;s.streak++;s.correct++;data.bestStreak=Math.max(data.bestStreak,s.streak);let gain=10+Math.min(10,(s.streak-1)*2);s.score+=gain;data.points=(data.points||0)+gain;if(s.mode==='review')data.reviewCorrect=(data.reviewCorrect||0)+1;data.wrong=data.wrong.filter(x=>x!==id)}else{s.streak=0;if(!data.wrong.includes(id))data.wrong.push(id)}app.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;if(s.options[Number(b.dataset.choice)]===q[1])b.classList.add('correct');else if(Number(b.dataset.choice)===i)b.classList.add('wrong')});app.querySelector('#feedback').innerHTML=`<div class="panel" style="background:${ok?'#f0fdf4':'#fff1f2'};box-shadow:none"><h2>${ok?'🎉 正解！':'💡 おしい！'}</h2><p><strong>正解：${esc(q[1])}</strong></p><p>${esc(q[5])}</p><button class="btn" id="next">${s.index+1===s.ids.length?'結果を見る':'次の問題へ →'}</button></div>`;app.querySelector('#next').onclick=()=>{s.index++;if(s.index>=s.ids.length)result();else question()};updateBadges()}
function result(){let s=session;data.games=(data.games||0)+1;data.completed.push({mode:s.mode,date:new Date().toISOString(),correct:s.correct,total:s.ids.length,score:s.score});data.completed=data.completed.slice(-30);save();screen='result';app.innerHTML=`<section class="panel" style="text-align:center"><div style="font-size:60px">${s.correct===s.ids.length?'🏆':'🎊'}</div><h2>チャレンジ終了！</h2><p style="font-size:25px;font-weight:800">${s.correct} / ${s.ids.length}問 正解</p><p>今回の獲得：${s.score}ポイント</p><p>現在の称号：<strong>${title()}</strong></p><p><button class="btn" id="home">ホームへ</button></p><p><button class="btn green" id="review" ${data.wrong.length?'':'disabled'}>間違えた問題を復習</button></p></section>`;app.querySelector('#home').onclick=home;app.querySelector('#review').onclick=()=>start('review');session=null}
updateBadges();home();
</script></body></html>
